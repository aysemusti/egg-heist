<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Egg Heist 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#1E2A1B; --panel:#FFF9EE; --panel-2:#F3EAD8; --line:#E2D4BA; --muted:#6F6656;
  --accent:#FF8A3D; --accent-dark:#D2601A; --money:#3DBB5C; --speed:#3B95F0; --hud:rgba(22,30,20,.78);
  --display:"Lilita One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Rubik",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#8FD3F5;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.pill{pointer-events:auto;background:var(--hud);color:#fff;border-radius:14px;padding:7px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.pill b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.pill small{opacity:.8;font-weight:700}
.coin{width:22px;height:22px;border-radius:50%;background:#FFD23F;color:#8A5A00;display:grid;place-items:center;font-family:var(--display);font-size:14px}
.where{font-family:var(--display);font-size:16px}
.mythic{background:linear-gradient(90deg,#C83FFF,#FF3FD0);}
.btn{pointer-events:auto;border:0;border-radius:14px;padding:9px 14px;font-family:var(--display);font-size:17px;background:var(--panel);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.btn.main{background:var(--accent);color:#fff}
.btn .cnt{background:var(--panel-2);border-radius:8px;padding:1px 7px;font-size:13px;margin-left:4px;font-family:var(--body);font-weight:800}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--hud);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;max-width:min(560px,calc(100vw - 150px));text-align:center;z-index:5;pointer-events:none}
#grab{position:fixed;right:18px;bottom:18px;width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-family:var(--display);font-size:24px;box-shadow:0 5px 0 var(--accent-dark);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#grab small{font-family:var(--body);font-size:11px;font-weight:700;opacity:.9}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:8;pointer-events:none;width:min(420px,calc(100vw - 24px))}
.toast{background:var(--panel);border-radius:14px;padding:9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;animation:pop .25s ease-out}
.toast img{width:40px;height:40px}.toast .em{font-size:26px;width:40px;text-align:center}
.toast b{display:block;font-size:15px}.toast span{font-size:12.5px;color:var(--muted)}
.toast.bad{background:#FFE3DC}.toast.myth{background:linear-gradient(90deg,#F7E3FF,#FFE3F6);border:2px solid #FF3FD0}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:rgba(10,14,10,.45);display:grid;place-items:center;z-index:10;padding:12px}
.sheet{background:var(--panel);border-radius:22px;width:min(680px,100%);max-height:min(720px,calc(100vh - 24px));display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:12px 12px 0;align-items:center}
.tab{border:0;background:transparent;font-family:var(--display);font-size:17px;padding:8px 12px;border-radius:12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected=true]{background:var(--panel-2);color:var(--ink)}
.close{margin-left:auto;border:0;width:38px;height:38px;border-radius:50%;background:var(--panel-2);font-size:22px;cursor:pointer}
.body{overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.note{color:var(--muted);font-size:13.5px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.up{background:var(--panel-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.up ul{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.up li{display:flex;justify-content:space-between}.up em{color:var(--money);font-style:normal}
.buy{border:0;border-radius:12px;padding:10px;background:var(--money);color:#fff;font-family:var(--display);font-size:17px;cursor:pointer;box-shadow:0 3px 0 #2A8A42}
.buy:disabled{background:#C9C2B2;box-shadow:none;cursor:default}
.sell{border:0;border-radius:10px;padding:7px 12px;background:#fff;font-weight:800;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);font-family:var(--body)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:14px;padding:6px 10px}
.item img{width:48px;height:48px}.item .info{flex:1;display:flex;flex-direction:column}.item .nm{font-weight:800}.item .sub{font-size:12.5px;color:var(--muted)}
.eggic{width:30px;height:38px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;margin:0 9px}
.chip{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:8px;color:#fff;text-transform:uppercase;letter-spacing:.04em;margin-left:4px}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.req{background:var(--panel-2);border-radius:12px;padding:7px 10px;font-size:12.5px;display:flex;flex-direction:column}
.req b{font-family:var(--display);font-weight:400;font-size:16px}.req.ok b::after{content:" ✓";color:var(--money)}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.cell{background:var(--panel-2);border-radius:12px;padding:6px;text-align:center;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell img{width:64px;height:64px}.cell.no img{filter:brightness(0) opacity(.22)}
#stick{position:fixed;width:90px;height:90px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;border-radius:50%;background:rgba(255,255,255,.75)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#8FD3F5;z-index:20;font-family:var(--display);font-size:28px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (max-width:640px){.top{flex-direction:column;gap:6px}.top .row{justify-content:flex-start!important}#toasts{top:118px}.pill{padding:5px 9px}.where{display:none!important}.pill b{font-size:18px}.btn{font-size:15px;padding:8px 10px}#grab{width:80px;height:80px;font-size:20px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="loading">Loading Egg Heist 3D…</div>
<div class="top">
  <div class="row">
    <div class="pill"><span class="coin">$</span><b id="money">0</b><small id="rate">+0/s</small></div>
    <div class="pill"><small>SPEED</small><b id="spd">0</b><small id="gain">+1/s</small></div>
    <div class="pill"><span id="sun">☀️</span><b id="clockT">3:00</b><small id="clockL">until night</small></div>
    <div class="pill where" id="where">Home</div>
    <div class="pill mythic" id="mythicPill" hidden></div>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button class="btn main" id="shopBtn">Shop</button>
    <button class="btn" id="penBtn">Pen <span class="cnt" id="penCnt">0/3</span></button>
    <button class="btn" id="idxBtn">Index <span class="cnt" id="idxCnt">0</span></button>
  </div>
</div>
<div class="hint" id="hint"></div>
<button id="grab" hidden>GRAB<small>or Space</small></button>
<div id="stick" hidden><i></i></div>
<div id="toasts"></div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="tabs">
      <button class="tab" data-tab="shop">Shop</button>
      <button class="tab" data-tab="pen">Pen</button>
      <button class="tab" data-tab="index">Index</button>
      <button class="close" id="closeBtn" aria-label="Close">×</button>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
(() => {
'use strict';
// ---- shared with Egg Heist (2D): data and animal drawings ----
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const EGG = new Path2D("M12 1.5C18.5 1.5 20.5 13 20.5 17C20.5 21.5 16.8 24.5 12 24.5C7.2 24.5 3.5 21.5 3.5 17C3.5 13 5.5 1.5 12 1.5Z");
function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'k';
  if (n < 1e9) return (n / 1e6).toFixed(n < 1e7 ? 2 : 1).replace(/\.?0+$/, '') + 'M';
  if (n < 1e12) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
  if (n < 1e15) return (n / 1e12).toFixed(2).replace(/\.?0+$/, '') + 'T';
  if (n < 1e18) return (n / 1e15).toFixed(2).replace(/\.?0+$/, '') + 'Qa';
  const SUF = ['Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd'];
  for (let k = 0; k < SUF.length; k++) if (n < 1e21 * 1000 ** k) return (n / (1e18 * 1000 ** k)).toFixed(2).replace(/\.?0+$/, '') + SUF[k];
  return n.toExponential(2).replace('e+', 'e');
}

    obs: { n: 15, kinds: [['cactus', 17, 17], ['rock', 26, 42]] }, guard: { name: 'Scorpion', m: 'g-scorpion', speed: 375, see: 190, seeCarry: 320 }, nests: [[1190, 240], [1230, 660]] },

    obs: { n: 14, kinds: [['crystal', 26, 40], ['cloud', 34, 50]] }, guard: { name: 'Prism Golem', m: 'g-prism', speed: 3350, see: 250, seeCarry: 380 }, nests: [[1200, 250], [1200, 650]] },
  { name: 'Mushroom Grove',   req: 3600, mult: 900e6, portal: '#9B5AE8', egg: '#EDE0FF', frame: '#2A2036', pal: { g: '#34503A', p: '#2E4834', p2: '#3E5C42' },
    obs: { n: 16, kinds: [['mushroom', 26, 44], ['tree', 30, 44]] }, guard: { name: 'Toadstool Troll', m: 'g-toadstool', speed: 3900, see: 250, seeCarry: 390 }, nests: [[1200, 250], [1200, 650]] },

// Biomes were designed on a 1400x900 map; they are now this much bigger.
const BW = 2200, BH = 1300, SX = BW / 1400, SY = BH / 900;
// guardian speeds use the same speed numbers as the player: a guardian with speed 75 runs like a player with speed 75
const GUARD_SPEED = [0, 75, 120, 250, 320, 450, 620, 800, 1200, 1750, 2200, 4000, 7000, 10000, 25000];
const speedPx = sp => 160 + 2.2 * Math.min(sp, 280) + 1.1 * Math.max(0, sp - 280);
// the same numbers are also the smallest speed you need to take eggs in that biome
BIOMES.forEach((b, i) => { b.req = GUARD_SPEED[i] || 0; b.guard.lv = GUARD_SPEED[i] || 0; b.guard.speed = Math.round(speedPx(b.guard.lv)); });
BIOMES.forEach(b => { b.nests = b.nests.map(([x, y]) => [Math.round(x * SX), Math.round(y * SY)]); b.obs.n = Math.round(b.obs.n * 2.1); });
const SPECIES = [

      <div class="up"><h3>Pen · level ${G.pL}/${PEN_MAX}</h3><ul><li>Slots for eggs and pets <b>${penSlots(G.pL)}${pMax ? '' : ` → <em>${penSlots(G.pL + 1)}</em>`}</b></li><li>Pet income bonus <b>+${Math.round((penBonus(G.pL) - 1) * 100)}%${pMax ? '' : ` → <em>+${Math.round((penBonus(G.pL + 1) - 1) * 100)}%</em>`}</b></li></ul>
        <button class="buy" data-buy="pen" ${pMax || G.money < penCost(G.pL) ? 'disabled' : ''}>${pMax ? 'Fully upgraded' : 'Upgrade · $' + fmt(penCost(G.pL))}</button></div></div>
      <h3>Speed needed to take eggs</h3>
      <div class="reqs">${BIOMES.map(b => `<div class="req ${G.speed >= b.req ? 'ok' : ''}"><span>${esc(b.name)}</span><b>Speed ${fmt(b.req)}</b><span>${esc(b.guard.name)} runs at ${fmt(b.guard.lv)}</span></div>`).join('')}</div>
      <p class="note">Carrying an egg takes away speed: rare −30, epic −100, legendary −250, mythic −300, divine −2000. Big eggs −600 more, huge eggs −2000 more. This 3D game has its own save, separate from Egg Heist.</p>
      <button class="sell" data-reset="1" style="align-self:flex-start;color:#B4432C">Reset 3D progress</button>`;
  } else if (tab === 'pen') {
    const rows = G.pen.slice().reverse().map(p => {
      const sp = SPECIES[p.sp];
      if (p.egg) return `<div class="item"><span class="eggic" style="background:${BIOMES[p.b].egg};box-shadow:0 0 0 3px ${RAR[p.r].color}"></span><div class="info"><span class="nm">${p.es ? EGG_SIZES[p.es].name + ' ' : ''}${RAR[p.r].name} ${BIOMES[p.b].name} egg</span><span class="sub">Hatching in ${Math.ceil(p.left)}s</span></div></div>`;
      return `<div class="item"><img src="${modelURL(sp.id, p.f || 0, p.mut)}" alt=""><div class="info"><span class="nm">${esc(petName3(p))}<span class="chip" style="background:${RAR[sp.r].color}">${RAR[sp.r].name}</span></span><span class="sub">${BIOMES[sp.b].name} · $${fmt(petInc3(p))}/s</span></div><button class="sell" data-sell="${p.id}">Sell $${fmt(petSell3(p))}</button></div>`;
    }).join('');
    body.innerHTML = `<div><h3>Your pen · ${G.pen.length}/${penSlots(G.pL)}</h3><p class="note">Pets earn money every second. Sell one to make room for a better one.</p></div><div class="list">${rows || '<p class="note">Your pen is empty. Bring an egg back from the Forest to get started.</p>'}</div>`;
  } else {
    body.innerHTML = `<h3>Animal index · ${SPECIES.filter(s => G.found[s.id]).length}/${SPECIES.length}</h3>` + BIOMES.map((b, bi) => `<div><h3 style="font-size:17px;margin:6px 0">${esc(b.name)}</h3><div class="idx">${SPECIES.filter(s => s.b === bi).sort((a, c) => RORDER.indexOf(a.r) - RORDER.indexOf(c.r)).map(s => `<div class="cell ${G.found[s.id] ? '' : 'no'}"><img src="${modelURL(s.id)}" alt="" loading="lazy">${G.found[s.id] ? esc(s.name) : '???'}<span class="chip" style="background:${RAR[s.r].color}">${RAR[s.r].name}</span></div>`).join('')}</div></div>`).join('');
  }
}
let resetArmed = false;
$('body').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.buy === 'tread' && G.tL < TREAD_MAX && G.money >= treadCost(G.tL)) { G.money -= treadCost(G.tL); G.tL++; toast('🏃', `Treadmill level ${G.tL}`, `You gain ${fmt(treadIdle(G.tL))} speed every second on it`); }
  else if (b.dataset.buy === 'pen' && G.pL < PEN_MAX && G.money >= penCost(G.pL)) { G.money -= penCost(G.pL); G.pL++; toast('🏡', `Pen level ${G.pL}`, `${penSlots(G.pL)} slots`); }
  else if (b.dataset.sell) { const i = G.pen.findIndex(p => p.id === +b.dataset.sell && !p.egg); if (i >= 0) { const p = G.pen[i]; G.money += petSell3(p); G.pen.splice(i, 1); syncPenObjects(); toast(SPECIES[p.sp].id, `Sold a ${petName3(p)}`, `+$${fmt(petSell3(p))}`); } }
  else if (b.dataset.reset) { if (!resetArmed) { resetArmed = true; b.textContent = 'Tap again to wipe all 3D progress'; return; } G = freshSave(); player.carry = null; syncCarryMesh(); syncPenObjects(); save(); resetArmed = false; toast('🧹', 'Fresh start', 'All 3D progress was wiped'); }
  save(); syncHud(); renderTab();
});

// ---------------- start ----------------
window.__egg3d = { get G() { return G; }, player, zones, tryGrab, openModal };
syncPenObjects();
fillEggs(); booting = false;
syncHud();
let last = performance.now();
camPos.copy(V(player.x, player.y)).add(new THREE.Vector3(0, 21, 22)); camLook.copy(V(player.x, player.y));
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000, dt);
  requestAnimationFrame(frame);
}
$('loading').remove();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
})();
</script>
</body>
</html>
