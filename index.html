<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Egg Heist: steal eggs from guardians, hatch pets and play with friends.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Egg Heist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen top-down world on canvas; floating HUD pills top, hint pill bottom, a sheet modal for Shop / Pen / Index.
   Single deliberate look (a bright toy farm), so every color is set explicitly and there is no dark variant. */
:root{
  --ink:#1E2A1B; --panel:#FFF9EE; --panel-2:#F3EAD8; --line:#E2D4BA; --muted:#6F6656;
  --accent:#FF8A3D; --accent-dark:#D2601A; --money:#3DBB5C; --speed:#3B95F0;
  --hud:rgba(22,30,20,.78);
  --c-common:#9AA58F; --c-rare:#3B95F0; --c-epic:#A85FE8; --c-legendary:#F2B418;
  --display:"Lilita One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Rubik",ui-rounded,system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#8DC966;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
.game{position:relative;height:100%;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{background:var(--hud);color:#fff;border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pill b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:#FFD23F;color:#8A5A00;display:grid;place-items:center;font-family:var(--display);font-size:14px;box-shadow:inset 0 -2px 0 #E0A800}
.money small{color:#9CF0B0}
.speed .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#BFE0FF}
.bar{width:64px;height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--speed);border-radius:5px;transition:width .15s}
.where{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.02em}
.ci{width:18px;height:18px;border-radius:50%;background:#FFD23F;box-shadow:0 0 8px #FFD23F;flex:none}
.ci.moon{background:transparent;box-shadow:inset -6px 2px 0 0 #FFF4C8}
.clock small{color:#FFE9A8}
.clock.night{background:rgba(28,30,82,.9)}
.hbtn.on{background:#3B95F0;color:#fff;box-shadow:0 4px 0 #1F6CBF}
.hbtn.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.hbtn.admin{background:#2B2230;color:#FFD23F;box-shadow:0 4px 0 #120E16}
.adm .up{gap:8px}
.adm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.adm input,.adm select{font:inherit;font-size:15px;font-weight:500;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.adm input:focus,.adm select:focus{outline:3px solid var(--speed);outline-offset:1px}
.adm-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.adm-btns .buy{margin:0;flex:1;font-size:16px;padding:9px 10px}
.adm-btns .sell{flex:none}
.unl{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:2px solid var(--line);font-size:14px}
.unl:last-child{border-bottom:0;padding-bottom:0}
.unl span{font-size:12px;color:var(--muted)}
.send-to{background:var(--panel-2);border-radius:16px;padding:12px 14px}
.send-to select{font-weight:700}
.adm-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gift-list{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--muted)}
.bag-btns{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.placebar{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#2B2230;color:#FFE066;font-weight:800;font-size:15px;padding:8px 10px 8px 16px;border-radius:14px;box-shadow:0 4px 0 #120E16;max-width:calc(100% - 32px)}
canvas.placing{cursor:crosshair}
.style-top{display:flex;gap:16px;align-items:center;background:var(--panel-2);border-radius:16px;padding:10px 14px}
#stylePrev{position:static;inset:auto;width:120px;height:140px;flex:none;background:radial-gradient(circle at 50% 70%,#CFE8B8,#A8D58A);border-radius:14px}
.chip.mut-mount{background:#8A5A35;color:#fff}.sell.riding{background:#FFE066}
.cos-sec{display:flex;flex-direction:column;gap:8px}
.cos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.cos{background:var(--panel-2);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px solid transparent}
.cos.on{border-color:var(--money);background:#E6F6E2}
.cos img{width:72px;height:84px}.cos b{font-size:13px;line-height:1.2}
.cos .buy,.cos .sell{margin:0;padding:6px 10px;font-size:13px;width:100%}
.cos .buy{font-family:var(--body);font-weight:800}
.events-box{border:2px solid #F2C230}.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.ev{background:#fff;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}.ev span{font-size:12px;color:var(--muted)}.ev .adm-btns{margin-top:auto}
.party-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
#partyCode{font-family:var(--display);font-size:26px;letter-spacing:.18em;text-transform:uppercase;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#partyCode:focus{outline:3px solid var(--speed);outline-offset:1px}
.party-code{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:16px;padding:12px 16px;flex-wrap:wrap}
.party-code span{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.party-code b{font-family:var(--display);font-weight:400;font-size:36px;letter-spacing:.14em;flex:1;-webkit-user-select:text;user-select:text}
.party-msg{color:#B4432C;font-weight:700}
.kid{width:30px;height:30px;border-radius:50%;flex:none;margin:0 5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.cloudpill{font-size:13px;font-weight:800}
.cloudpill.error{background:rgba(160,52,36,.88)}
.cloud-box{background:var(--panel-2);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cloud-box p{margin:0;flex:1;min-width:200px;font-size:14px;line-height:1.4}
.cloud-box .buy{margin:0;padding:8px 14px;font-size:16px}
.mythicpill{background:linear-gradient(90deg,#D61FA8,#6A3FE0,#1F9EC0);font-size:13px;font-weight:800}
.mythicpill.divinepill{background:linear-gradient(90deg,#FFF1A8,#F2C230,#FFF1A8);color:#5A3A00;box-shadow:0 0 12px rgba(255,210,63,.8)}
.mythicpill.eternalpill{background:linear-gradient(90deg,#3FD8E8,#E4FBFF,#3FD8E8);color:#0A4A55;box-shadow:0 0 12px rgba(63,216,232,.8)}
.mythicpill.secretpill{background:linear-gradient(90deg,#1E1828,#5A2E8A,#1E1828);color:#F3E8FF;box-shadow:0 0 12px rgba(154,74,224,.8)}
.mythicpill.eventpill{background:linear-gradient(90deg,#3DBB5C,#9BE86A);color:#0E3A18}
.mythicpill.abusepill{background:linear-gradient(90deg,#F2C230,#FF7A2A,#E8402C);color:#2B1A00}
.spacer{flex:1}
.hbtn{pointer-events:auto;border:0;cursor:pointer;font-family:var(--display);font-size:17px;color:var(--ink);background:var(--panel);border-radius:14px;padding:8px 14px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:6px}
.hbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.hbtn .cnt{font-family:var(--body);font-weight:800;font-size:12px;background:var(--panel-2);border-radius:8px;padding:1px 6px}
.hbtn.shop{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dark)}
.hbtn.icon{padding:8px 10px}
.hbtn svg{width:18px;height:18px}
.hbtn .off{display:none}.hbtn.muted .on{display:none}.hbtn.muted .off{display:block}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

.hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 140px);
  background:var(--hud);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:12px;text-align:center;pointer-events:none;text-wrap:balance}
.hint:empty{display:none}
@media (max-width:520px){.hint{max-width:calc(100% - 32px);bottom:calc(120px + env(safe-area-inset-bottom,0px))}}

.toasts{position:absolute;left:50%;top:76px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92%,420px)}
.toast{background:var(--panel);color:var(--ink);border-radius:14px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 4px 0 var(--line),0 10px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;animation:tin .25s ease-out}
.toast .em{font-family:var(--emoji);font-size:26px;line-height:1}
.toast .t2{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.toast .new{font-family:var(--display);font-weight:400;font-size:12px;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px}
.toast.mythic{background:linear-gradient(120deg,#FFE6F8,#E8E4FF 50%,#DDF6FB);box-shadow:0 4px 0 #FF3FD0,0 0 0 2px #FF8AE0,0 10px 28px rgba(255,63,208,.35)}
.toast.mythic .t1{background:linear-gradient(90deg,#D61FA8,#6A3FE0,#1F9EC0);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast.bad{background:#FFE3DC;box-shadow:0 4px 0 #F2B5A6}
.toast.out{animation:tout .3s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

.runbtn{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;
  background:var(--speed);color:#fff;font-family:var(--display);font-size:26px;box-shadow:0 6px 0 #1F6CBF,0 10px 24px rgba(0,0,0,.25);touch-action:manipulation}
.runbtn.hitbtn{right:calc(max(18px,env(safe-area-inset-right,0px)) + 106px);background:#8A5A35;box-shadow:0 5px 0 #5A3A22;width:76px;height:76px;font-size:19px}
.runbtn.dropbtn{right:calc(max(18px,env(safe-area-inset-right,0px)) + 106px);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:15px;background:#E8402C;box-shadow:0 5px 0 #A82A1E}
.runbtn.jumpbtn{bottom:calc(124px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:16px;background:#3B95F0;box-shadow:0 5px 0 #24539E}
@media (hover:hover) and (pointer:fine){.runbtn.jumpbtn{display:none}}
.runbtn small{display:block;font-family:var(--body);font-size:11px;font-weight:700;opacity:.9}
.runbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1F6CBF}

.modal{position:absolute;inset:0;background:rgba(20,28,18,.5);display:grid;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:660px;max-height:100%;background:var(--panel);border-radius:22px;box-shadow:0 8px 0 var(--line),0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:6px;padding:12px 12px 0 14px;flex-wrap:wrap}
.tab{border:0;cursor:pointer;font-family:var(--display);font-size:18px;color:var(--muted);background:transparent;padding:8px 12px;border-radius:12px}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.close{margin-left:auto;border:0;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--panel-2);color:var(--ink);font-size:22px;line-height:1;font-weight:800}
.sheet-body{overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.1}
.note{margin:0;color:var(--muted);font-size:14px;line-height:1.4}

.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.up{background:var(--panel-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.up-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lv{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.up ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.up li{display:flex;justify-content:space-between;gap:10px}
.up li b{font-variant-numeric:tabular-nums}
.up li b em{font-style:normal;color:var(--money)}
.buy{margin-top:auto;border:0;cursor:pointer;font-family:var(--display);font-size:18px;color:#fff;background:var(--money);border-radius:12px;padding:10px;box-shadow:0 4px 0 #2A8F44}
.buy:disabled{background:#C9C1B0;box-shadow:0 4px 0 #ADA594;cursor:not-allowed}
.buy:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #2A8F44}
.reqs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.req{background:var(--panel-2);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.req b{font-family:var(--display);font-weight:400;font-size:17px}
.req.ok b::after{content:" ✓";color:var(--money)}
.reset{align-self:flex-start;border:0;background:transparent;color:#B4432C;font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline}

.penlist{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:14px;padding:8px 10px}
.row .em{font-family:var(--emoji);font-size:32px;width:40px;text-align:center;flex:none;line-height:1}
.row .info{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-weight:800}
.row .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:6px;padding:1px 6px;vertical-align:1px}
.chip.C{background:var(--c-common)}.chip.R{background:var(--c-rare)}.chip.E{background:var(--c-epic)}.chip.L{background:var(--c-legendary)}.chip.Z1{background:#3FA86A}.chip.Z2{background:#E8572C}
.chip.F1{background:#B05AF0}.chip.F2{background:linear-gradient(90deg,#E09A10,#FFD23F);color:#4A3000}
.fusebtn{margin:0;padding:8px 14px;font-size:16px;flex:none}
.chip.mut-bronze{background:#B8703A}.chip.mut-silver{background:#8E99A8}.chip.mut-golden{background:#E0A810;color:#4A3000}
.chip.mut-singer{background:linear-gradient(90deg,#FF5AB4,#3FB8E0)}.chip.mut-enchanted{background:#8A4AE0;box-shadow:0 0 6px #C86AFF}.chip.mut-dark{background:#2B2230;box-shadow:0 0 6px #7A2EBA}
.mut-box{gap:10px}.mut-list{display:flex;flex-wrap:wrap;gap:6px}.mut-list .chip{font-size:11px;padding:3px 8px}.mut-list .chip.none{opacity:.35}
.mut-box .buy{margin:0;align-self:flex-start;padding:9px 18px;font-size:16px}
.chip.D{background:linear-gradient(90deg,#F2C230,#FFF8E0 50%,#F2C230);color:#6A4A00;box-shadow:0 0 6px rgba(242,194,48,.8)}
.chip.M{background:linear-gradient(90deg,#FF3FD0,#7F5BFF,#3FC8E0)}
.chip.S{background:linear-gradient(90deg,#1E1828,#5A2E8A,#1E1828);box-shadow:0 0 6px rgba(154,74,224,.8)}
.chip.T{background:linear-gradient(90deg,#3FD8E8,#E4FBFF 50%,#3FD8E8);color:#0A4A55;box-shadow:0 0 6px rgba(63,216,232,.8)}
.sell{border:0;cursor:pointer;font-weight:800;font-size:13px;background:#fff;color:var(--ink);border-radius:10px;padding:7px 10px;box-shadow:0 3px 0 var(--line);flex:none}
.eggic{width:26px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin:0 7px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.1)}

.biome{display:flex;flex-direction:column;gap:8px}
.biome-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.biome-head span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{background:var(--panel-2);border-radius:14px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.card .em{font-family:var(--emoji);font-size:38px;line-height:1.1}
.card .nm{font-weight:800;font-size:13px;line-height:1.15}
.card .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row img.em{width:46px;height:46px;font-size:0}
.card img.em{width:64px;height:64px}
.toast .em img{width:38px;height:38px;display:block}
.gi{width:22px;height:22px;vertical-align:-6px}
.card.locked .em{filter:brightness(0);opacity:.22}
.card.locked .nm{color:var(--muted)}
.card.L:not(.locked){border-color:var(--c-legendary);background:#FFF3CF}
.card.D:not(.locked){border-color:#F2C230;background:radial-gradient(circle at 50% 30%,#FFFFFF,#FFF1C2);box-shadow:0 0 14px rgba(242,194,48,.55)}
.card.M:not(.locked){border-color:#FF3FD0;background:linear-gradient(160deg,#FFE6F8,#E8E4FF 55%,#DDF6FB)}
.card.E:not(.locked){border-color:#DCC2F5}
@media (prefers-reduced-motion:reduce){.toast,.toast.out{animation-duration:.01s}}
</style>

</head>
<body>
<div class="game" id="game">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="pill money"><span class="coin">$</span><b id="money">0</b><small id="rate">+0/s</small></div>
    <div class="pill" id="rockPill" hidden><span>🪨</span><b id="rocks">0</b></div>
    <div class="pill speed"><span class="lbl">Speed</span><b id="spd">0</b><div class="bar"><i id="spdBar"></i></div><small id="spdCap">max 30</small></div>
    <div class="pill clock" id="clock"><span class="ci" id="clockIcon"></span><b id="clockT">3:00</b><small id="clockL">until night</small></div>
    <div class="pill where" id="where">Home</div>
    <div class="pill mythicpill" id="mythicPill" hidden></div>
    <div class="pill mythicpill abusepill" id="abusePill" hidden></div>
    <div class="pill mythicpill eventpill" id="eventPill" hidden></div>
    <div class="pill mythicpill divinepill" id="divinePill" hidden></div>
    <div class="pill mythicpill eternalpill" id="eternalPill" hidden></div>
    <div class="pill mythicpill secretpill" id="secretPill" hidden></div>
    <div class="pill cloudpill" id="cloudSt" hidden>☁</div>
    <div class="spacer"></div>
    <button class="hbtn shop" id="shopBtn">Shop</button>
    <button class="hbtn" id="penBtn">Pen <span class="cnt" id="penCnt">0/3</span></button>
    <button class="hbtn" id="bagBtn">Bag <span class="cnt" id="bagCnt">0</span></button>
    <button class="hbtn" id="indexBtn">Index <span class="cnt" id="idxCnt">0/18</span></button>

<script>
// Website stand-in for claude.ai's live room: parties connect players directly with PeerJS.
// The first page to claim a party code is its host; everyone else connects to the host,
// and the host passes each player's position on to the others.
(() => {
  const NICK_KEY = 'egg-heist-nick';
  // ---- owner login: only hashes are stored here, never the password ----
  const ADMIN_H1 = 'f1aa095eccdf68fbbbb5e0819dd0617ba2c1c3025b687c67489006c64f5b6657', ADMIN_H2 = '1b70fc5bbd78857547150c658223c695766f425f1881ea7edeaccc52139b48d5', ADMIN_KEY = 'egg-heist-owner';
  const sha = async str => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)))].map(b => b.toString(16).padStart(2, '0')).join('');
  let adminKey = null, adminOk = false, current = null;
  const lobby = {};
  const ready = (async () => { try { const k = localStorage.getItem(ADMIN_KEY); if (k && await sha(k) === ADMIN_H2) { adminKey = k; adminOk = true; } } catch (e) {} })();
  const deliver = (topic, data, isMe) => (lobby[topic] || []).forEach(f => { try { f({ topic, data, isMe, peer: '', by: null, sameTab: isMe, kind: 'viewer', guest: false }); } catch (e) {} });
  window.__siteAdmin = { unlock: async () => {
    const pw = (window.prompt('Owner password') || '').trim();
    if (!pw || await sha(pw) !== ADMIN_H1) return false;
    adminKey = await sha('msg:' + pw); adminOk = true;
    try { localStorage.setItem(ADMIN_KEY, adminKey); } catch (e) {}
    return true;
  } };
  let nick = '';
  function askNick() {
    let n = '';
    try { n = localStorage.getItem(NICK_KEY) || ''; } catch (e) {}
    if (!n) {
      n = (window.prompt('What name should your friends see?', '') || '').replace(/[^\p{L}\p{N} _.-]/gu, '').trim().slice(0, 16) || 'Player';
      try { localStorage.setItem(NICK_KEY, n); } catch (e) {}
    }
    return n;
  }
  function makeRoom(peer, isHost, hostConn, early) {
    const others = new Map(), conns = new Set(), hs = [], errs = [];
    let mine = {}, closed = false;
    const view = (id, pres) => ({ peer: id, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: pres || {}, updatedAt: Date.now() });
    const fire = (joined, left, updated) => { const peers = [...others.values()]; hs.forEach(h => { try { h({ peers, joined, left, updated }); } catch (e) {} }); };
    const setPeer = (id, pres) => { if (id === peer.id) return; const had = others.has(id), v = view(id, pres); others.set(id, v); fire(had ? [] : [v], [], had ? [v] : []); };
    const dropPeer = id => { const v = others.get(id); if (!v) return; others.delete(id); fire([], [v], []); };
    const sendAll = (msg, except) => conns.forEach(c => { if (c !== except && c.open) { try { c.send(msg); } catch (e) {} } });
    const end = () => { if (closed) return; closed = true; errs.forEach(f => { try { f({ code: 'upstream_error', message: 'The party ended' }); } catch (e) {} }); };
    const handle = (msg, from) => {
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'p' && typeof msg.id === 'string' && msg.p && typeof msg.p === 'object') { setPeer(msg.id, msg.p); if (isHost) sendAll(msg, from); }
      else if (msg.t === 'e' && typeof msg.topic === 'string' && typeof msg.key === 'string') {
        if (isHost) sendAll(msg, from);
        sha(msg.key).then(x => { if (x === ADMIN_H2) deliver(msg.topic, msg.data, false); });
      }
      else if (msg.t === 'bye' && typeof msg.id === 'string') { dropPeer(msg.id); if (isHost) sendAll(msg, from); }
    };
    const wire = conn => {
      conns.add(conn);
      // the host trusts the connection's own id, never an id a player claims
      conn.on('data', d => { if (isHost && d && typeof d === 'object') d.id = conn.peer; handle(d, conn); });
      conn.on('close', () => { conns.delete(conn); if (isHost) { dropPeer(conn.peer); sendAll({ t: 'bye', id: conn.peer }); } else end(); });
      conn.on('error', () => {});
    };
    if (isHost) {
      peer.on('connection', conn => conn.on('open', () => {
        wire(conn);
        conn.send({ t: 'p', id: peer.id, p: mine });
        others.forEach(v => { if (v.peer !== conn.peer) conn.send({ t: 'p', id: v.peer, p: v.presence }); });
      }));
    } else { wire(hostConn); hostConn.liveRoom = true; (early || []).forEach(d => handle(d, hostConn)); }
    peer.on('disconnected', () => { if (!closed) { try { peer.reconnect(); } catch (e) {} } });
    const roomObj = {
      sendEvent: msg => sendAll(msg),
      presence: async patch => { mine = { ...mine, ...patch, n: nick }; for (const k in patch) if (patch[k] === null) delete mine[k]; sendAll({ t: 'p', id: peer.id, p: mine }); },
      onPeers: (h, onErr) => { hs.push(h); if (onErr) errs.push(onErr); setTimeout(() => { const ps = [...others.values()]; h({ peers: ps, joined: ps, left: [], updated: [] }); }, 0); return () => {}; },
      peers: () => [...others.values()],
      on: () => () => {}, emit: async () => {},
      connected: () => !closed,
      leave: async () => { closed = true; if (current === roomObj) current = null; sendAll({ t: 'bye', id: peer.id }); setTimeout(() => { try { peer.destroy(); } catch (e) {} }, 300); },
    };
    current = roomObj; window.__partyMe = peer.id;
    errs.push(() => { if (current === roomObj) current = null; });
    return roomObj;
  }
  const ICE = { config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' },
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' },
  ] } };
  const p2pRoom = {
    on: (topic, f) => { (lobby[topic] = lobby[topic] || []).push(f); return () => {}; },
    emit: async (topic, data) => {
      await ready;
      if (!adminOk) throw { code: 'not_permitted' };
      deliver(topic, data, true);
      if (current) current.sendEvent({ t: 'e', topic, data, key: adminKey });
    },
    join: name => new Promise((resolve, reject) => {
      if (!window.Peer) { reject({ code: 'upstream_error' }); return; }
      nick = nick || askNick();
      const hostId = 'egg-heist-v1-' + name;
      let done = false;
      const ok = r => { if (!done) { done = true; clearTimeout(timer); resolve(r); } };
      const fail = c => { if (!done) { done = true; clearTimeout(timer); reject({ code: c }); } };
      let found = false;   // true once the party's host is known to exist
      const timer = setTimeout(() => fail(found ? 'blocked' : 'upstream_error'), 20000);
      const host = new Peer(hostId, ICE);
      host.on('open', () => {
        // the code was free, so no such party exists: when joining, say so instead of starting an empty party
        if (window.__partyJoinHow === 'join') { try { host.destroy(); } catch (e) {} fail('not_found'); return; }
        ok(makeRoom(host, true));
      });
      host.on('error', e => {
        if (done) return;
        if (!e || e.type !== 'unavailable-id') { fail('upstream_error'); return; }
        // someone already made this party: join it
        try { host.destroy(); } catch (er) {}
        found = true;
        const me = new Peer(ICE);
        me.on('open', () => {
          const c = me.connect(hostId, { reliable: true }), early = [];
          // keep anything the host sends before this page is ready (the list of who is already here)
          c.on('data', d => { if (!c.liveRoom) early.push(d); });
          c.on('open', () => ok(makeRoom(me, false, c, early)));
        });
        me.on('error', er => fail(er && er.type === 'peer-unavailable' ? 'not_found' : 'upstream_error'));
      });
    }),
  };
  const siteUser = { isOwner: async () => { await ready; return adminOk; }, canEdit: async () => { await ready; return adminOk; }, id: async () => null, profiles: async () => ({}) };
  window.claude = { use: async n => (n === 'room' ? p2pRoom : n === 'user' ? siteUser : null) };
})();
</script>

// ================= INPUT =================
const keys = {};
let joy = null, modalOpen = false;
addEventListener('keydown', ev => {
  if (placing && ev.key === 'Escape') { stopPlacing(); return; }
  if (modalOpen) { if (ev.key === 'Escape') closeModal(); return; }
  keys[ev.key.toLowerCase()] = true;
  if (ev.key.startsWith('Arrow') || ev.key === ' ') ev.preventDefault();
  if ((ev.key === ' ' || ev.key === 'e' || ev.key === 'E') && !ev.repeat) tap();
  if ((ev.key === 'q' || ev.key === 'Q') && !ev.repeat) toggleSlow();
  if ((ev.key === 'f' || ev.key === 'F') && !ev.repeat) swingBat();
  if ((ev.key === 'x' || ev.key === 'X') && !ev.repeat) dropCarry();
});
addEventListener('keyup', ev => { keys[ev.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy = null; });
cv.addEventListener('pointerdown', ev => { if (placing) { placeAt(ev); return; } audioOn(); joy = { id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, x: ev.clientX, y: ev.clientY }; cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointermove', ev => { if (joy && joy.id === ev.pointerId) { joy.x = ev.clientX; joy.y = ev.clientY; } });
const endJoy = ev => { if (joy && joy.id === ev.pointerId) joy = null; };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
$('runBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); audioOn(); tap(); });
$('hitBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); audioOn(); swingBat(); });
$('dropBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); audioOn(); dropCarry(); });
$('jumpBtn').addEventListener('pointerdown', ev => { ev.preventDefault(); audioOn(); jump(); });
function inputVec() {
  let x = 0, y = 0;
  if (keys['arrowleft'] || keys['a']) x -= 1; if (keys['arrowright'] || keys['d']) x += 1;
  if (keys['arrowup'] || keys['w']) y -= 1; if (keys['arrowdown'] || keys['s']) y += 1;
  if (joy) { const dx = joy.x - joy.sx, dy = joy.y - joy.sy, m = Math.hypot(dx, dy); if (m > 8) { const k = Math.min(1, m / 55); x += dx / m * k; y += dy / m * k; } }
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  return [x, y];
}

// ================= AUDIO =================
let ac = null;
function audioOn() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'triangle', v = .1, slide = 1, when = 0) {
  if (!ac || G.muted) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .03);
}
const sfx = {
  tap: () => tone(380 + Math.min(10, tapHeat) * 30, .05, 'square', .03, 1.2),
  grab: () => { tone(660, .08); tone(990, .1, 'triangle', .1, 1, .07); },
  drop: () => tone(520, .14, 'sine', .12, .7),
  hatch: (L) => [523, 659, 784, L ? 1046 : 0].forEach((f, i) => f && tone(f, .2, 'triangle', .09, 1, i * .08)),
  caught: () => { tone(300, .35, 'sawtooth', .07, .4); },
  alert: () => tone(880, .08, 'square', .04, 1.4),
  buy: () => { tone(784, .08); tone(1175, .14, 'triangle', .1, 1, .07); },
  portal: () => tone(300, .3, 'sine', .1, 3),
  deny: () => tone(200, .15, 'square', .05, .8),
  jump: () => tone(420, .12, 'sine', .07, 1.8),
  swing: () => tone(260, .08, 'sawtooth', .03, 2.2),
  bonk: () => { tone(180, .12, 'square', .08, .6); tone(900, .06, 'triangle', .06, 1, .03); },
};

// ================= GAMEPLAY =================
let nearEgg = null, btnMode = null;
// the round corner button is RUN on the treadmill and GRAB next to an egg
function setActionBtn(mode) {
  if (mode === btnMode) return; btnMode = mode;
  const b = $('runBtn'); b.hidden = !mode;
  if (mode === 'run') b.innerHTML = 'RUN<small>tap fast</small>';
  if (mode === 'grab') b.innerHTML = 'GRAB<small>or Space</small>';
  if (mode === 'adopt') b.innerHTML = 'ADOPT<small>or Space</small>';
  if (mode === 'trade') b.innerHTML = 'TRADE<small>or Space</small>';
}
function tryGrab() {
  const e = nearEgg; if (!e || player.carry) return;
  if (e.loose) {
    const li = loose.indexOf(e); if (li < 0) return;
    loose.splice(li, 1); markTaken(e.id);
  } else {
    if (!biome) return;
    const i = biome.eggs.indexOf(e); if (i < 0) return;
    biome.eggs.splice(i, 1);
    if (e.id) { markTaken(e.id); slotRespawn(e); } else biome.respawn.push(3);
  }
  player.carry = { r: e.r, b: e.b, es: e.es || 0 }; nearEgg = null;
  sfx.grab(); burst(e.x, e.y, RAR[e.r].color, 12);
  floatText(e.x, e.y - 30, (e.es ? EGG_SIZES[e.es].name + ' ' : '') + RAR[e.r].name + ' egg!', RAR[e.r].color);
  const loss = carryLoss(player.carry); if (loss) floatText(player.x, player.y - 90, '-' + fmt(loss) + ' speed', '#FF9A8A', 1.4);
}
function tap() {
  if (modalOpen) return;
  if (nearEgg) tryGrab(); else if (nearPet) adoptPet(); else if (nearTrader) openModal('trade'); else jump();
}
// put down the egg you are carrying, right where you stand (in a party everyone sees it)
function dropCarry() {
  if (modalOpen || !player.carry) return;
  const c = player.carry; player.carry = null;
  dropEgg(c, player.x + player.fx * 30, player.y + 10);
  sfx.drop(); floatText(player.x, player.y - 80, 'Dropped!', '#FFE066', 1);
  sendPresence(true); save();
}
// Space jumps when there is no egg or pet to pick up
function jump() {
  if (player.jz > 0 || player.fly) return;
  player.vz = 560; sfx.jump();
}
// knocked away by a bat or a guardian: you drop your egg and fly a few metres
function knock(dir, title, sub, icon, power = 1) {
  if (player.carry) { dropEgg(player.carry, player.x, player.y); player.carry = null; }
  player.fly = { vx: (dir || 1) * 760 * power, t: .42 + .06 * (power - 1) }; player.vz = 430 + 60 * (power - 1); player.invuln = 1.2;
  sfx.caught(); if (!reduce) shake = 8;
  burst(player.x, player.y - 30, '#FFFFFF', 14);
  if (title) toast(icon || '💥', title, sub || '', true);
  save();
}
function swingBat() {
  if (modalOpen || !party || player.batCd > 0) return;
  player.batCd = .55; player.swingT = .28; swingSeq++; sfx.swing();
  // hit the closest friend in front of you
  let best = null, bd = 1e9;
  for (const fr of lastFriends) {
    const dx = fr.v.x - player.x, dy = fr.v.y - player.y;
    if (Math.abs(dy) > 60 || Math.abs(dx) > 95 || (dx * player.fx < -20)) continue;
    const d = Math.hypot(dx, dy); if (d < bd) { bd = d; best = fr; }
  }
  if (best) {
    hitSeq++; myHit = [best.p.peer, hitSeq, Math.sign(best.v.x - player.x) || player.fx, batItem(G.bat).power];
    floatText(best.v.x, best.v.y - 80, 'BONK!', '#FFE066', 1); burst(best.v.x, best.v.y - 30, '#FFE066', 10); sfx.bonk();
  }
  sendPresence(true);
}

function update(dt) {
  // income and hatching continue everywhere, even with menus open
  let rate = 0, penChanged = false;
  for (const p of G.pen) {
    if (p.egg) { p.left -= dt * (abuseOn() ? 2 : 1); if (p.left <= 0) { hatch(p); penChanged = true; } }
    else rate += petInc(p);
  }
  G.money += rate * dt;
  // day and night
  const prevClock = G.clock; G.clock += dt;
  for (const w of [30, 10]) if (scene !== 'hub' && prevClock < DAY - w && G.clock >= DAY - w) toast('🌙', `Night falls in ${w} seconds`, 'Head home and put your egg in the pen before dark. Eggs you carry disappear at night.', true);
  if (prevClock < DAY && G.clock >= DAY) startNight();

        tx = player.x; ty = player.y; sp = GD.speed;
        if (d < 30 && player.invuln <= 0) { caught({ guard: GD }, g); return; }
      } else if (g.st === 'fetch') {
        const e = loose.find(o => o.id === g.fetchId);
        if (!e || zoneAt(e.x) !== zi) { g.st = 'return'; g.fetchId = null; continue; }
        tx = e.x; ty = e.y; sp = GD.speed;
        if (dist(g.x, g.y, e.x, e.y) < 28) {
          // picked it up: it disappears from the ground (for everyone in a party) and goes back to the nest
          loose.splice(loose.indexOf(e), 1); if (nearEgg === e) nearEgg = null; markTaken(e.id);
          g.carry = { r: e.r, es: e.es || 0 }; g.st = 'return'; g.fetchId = null;
          if (scene === zi) floatText(g.x, g.y - 80, 'Got it back!', '#FFB8A8', 1.2);
          continue;
        }
      } else if (g.st === 'return') {
        tx = g.hx; ty = g.hy; sp = GD.speed * .55;
        if (dist(g.x, g.y, g.hx, g.hy) < 20) {
          g.st = 'patrol'; g.x = g.hx; g.y = g.hy;
          // in a party the egg is put down by the nest where everyone can see it
          if (g.carry) { if (party) dropEgg({ r: g.carry.r, b: zi, es: g.carry.es || 0 }, g.hx + 40, g.hy + 10); else spawnEgg(zi, g.carry); g.carry = null; }
        }

        if (g.st === 'patrol' && scene === zi) g.fx = Math.sign(player.x - g.x) || g.fx;
        g.alert = Math.max(0, g.alert - dt);
        continue;
      }
      const dx = tx - g.x, dy = ty - g.y, m = Math.hypot(dx, dy) || 1;
      const step = Math.min(m, sp * dt), n = Math.max(1, Math.ceil(step / 14));

      if (g.st === 'chase' && player.invuln <= 0 && dist(player.x, player.y, g.x, g.y) < 30) { caught({ guard: GD }, g); return; }
      if (Math.abs(dx) > 2) g.fx = Math.sign(dx);
      g.x = clamp(g.x, HOME_W + 20, WORLD_W - 20); g.y = clamp(g.y, 20, BH - 20);
      g.alert = Math.max(0, g.alert - dt);
    }
  }
}
function pushOut(o, r) {

  for (const ob of zones[z].obst) {
    const dx = o.x - ob.x, dy = o.y - ob.y, d = Math.hypot(dx, dy), min = ob.r + r;
    if (d < min && d > 0.001) { o.x = ob.x + dx / d * min; o.y = ob.y + dy / d * min; }
  }
}

  for (const [sx, sy, ph] of STARS) { ctx.fillStyle = `rgba(255,252,235,${a * (.45 + .45 * Math.sin(t * 2 + ph))})`; const r = DPR * (1 + (ph % 1.5)); ctx.fillRect(sx * cv.width, sy * cv.height, r, r); }
  const mx = cv.width - 90 * DPR, my = 130 * DPR, mr = 26 * DPR;
  ctx.fillStyle = `rgba(255,248,215,${a})`; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(40,48,96,${a})`; ctx.beginPath(); ctx.arc(mx + mr * .45, my - mr * .25, mr * .85, 0, 7); ctx.fill();
}
let last = performance.now(), hudT = 0, saveT = 0, lastDraw = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  update(dt);
  hudT += dt; if (hudT > .1) { hudT = 0; syncHud(); }
  presT += dt; if (presT > .066) { presT = 0; sendPresence(false); }
  if (THUNDER >= 0) updateMeteors(dt);
  clockT += dt; if (clockT > .5) { clockT = 0; checkAbuse(); checkEvents(); if (party) { readFriends(); syncPartyClock(); } }
  saveT += dt; if (saveT > 4) { saveT = 0; save(); }

  // while a menu covers the screen, redraw the world only 4 times a second (the game keeps running)
  if (modalOpen && now - lastDraw < 250) { requestAnimationFrame(frame); return; }
  lastDraw = now;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = scene === 'hub' ? '#7DB958' : BIOMES[scene].frame;
  ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0;
  if (shake > 0) { sx = rand(-shake, shake); sy = rand(-shake, shake); shake = Math.max(0, shake - dt * 40); }
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, (-camX * Z + sx) * DPR, (-camY * Z + sy) * DPR);
  drawWorld(t, dt);
  for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = 1 - (f.t / f.life) ** 2; label(f.text, f.x, f.y - f.t * 40, 18, f.color); }
  ctx.globalAlpha = 1;
  drawFriendArrows();
  drawNight(t, dt);
  // joystick
  if (joy && !modalOpen) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 55, 0, 7); ctx.fill(); ctx.stroke();
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, m = Math.hypot(dx, dy), k = m > 55 ? 55 / m : 1;
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(joy.sx + dx * k, joy.sy + dy * k, 22, 0, 7); ctx.fill();
  }
  requestAnimationFrame(frame);
}
function camTarget() {
  const vw = W / Z, vh = H / Z;
  const mx = plotMinX(), tx = worldW - mx <= vw ? mx + (worldW - mx - vw) / 2 : clamp(player.x - vw / 2, mx, worldW - vw);
  const top = -64 / Z, vh2 = vh - 64 / Z;
  const ty = worldH <= vh2 ? top + (worldH - vh2) / 2 : clamp(player.y - 30 - vh / 2, top, worldH - vh);
  return [tx, ty];
}
function updateCam(dt) { const [tx, ty] = camTarget(); camX += (tx - camX) * Math.min(1, dt * 8); camY += (ty - camY) * Math.min(1, dt * 8); }
function snapCam() { [camX, camY] = camTarget(); }

// ================= BOOT =================
function boot(data) {
  let saved = data && data.save;
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {} }
  G = loadSave(saved);
  worldW = WORLD_W; worldH = BH;
  resize();
  goHome();
  const c = G.carry;
  if (c && RAR[c.r] && BIOMES[c.b]) player.carry = { r: c.r, b: c.b, es: c.es || 0 };
  // set up every biome now so Mythic eggs can appear (and be announced) anywhere
  mythicBatch = []; for (let i = 0; i < BIOMES.length; i++) getZone(i);
  const startMythics = mythicBatch; mythicBatch = null;
  ensureMythic(startMythics);
  setTimeout(() => toastMythic(startMythics), 900);
  syncMute(); syncSlow(); syncHud(); setLang(G.lang, true);
  new ResizeObserver(() => { resize(); snapCam(); }).observe($('game'));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); cloudPush(); } });
  cloudInit();
  setInterval(cloudPush, 30000);
  syncParty();
  adminInit();
  let savedParty = null; try { savedParty = localStorage.getItem(PARTY_KEY); } catch (e) {}
  if (savedParty) joinParty(savedParty, 'rejoin');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => { G.carry = player.carry; return { save: G }; });
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
